<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>مواقيت الصلاة حسب موقعك</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 16px;
      color: #222;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 0.3rem;
    }
    #status {
      text-align: center;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 0.4rem;
    }
    #location, #dates, #methodWrapper {
      text-align: center;
      font-size: 0.95rem;
      margin-bottom: 0.4rem;
    }
    #dates div {
      margin: 2px 0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      border-radius: 12px;
      overflow: hidden;
      margin: 10px 0 14px;
    }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }
    th {
      background: #1976d2;
      color: #fff;
      font-weight: 600;
      font-size: 0.95rem;
    }
    tr:last-child td {
      border-bottom: none;
    }
    #countdownBox {
      background: #fff;
      border-radius: 12px;
      padding: 10px 14px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      text-align: center;
      font-size: 1rem;
    }
    #nextPrayerName {
      font-weight: 600;
    }
    #countdown {
      font-family: "SF Mono", Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 1.1rem;
    }
    select {
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: inherit;
      margin-top: 4px;
    }
    .small {
      font-size: 0.85rem;
      color: #666;
      margin-top: 4px;
    }
    @media (max-width: 480px) {
      body { padding: 10px; }
      th, td { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>مواقيت الصلاة اليوم</h1>
    <div id="status">جاري طلب إذن الوصول لموقعك...</div>

    <div id="location"></div>

    <div id="dates">
      <div id="gregDate">التاريخ الميلادي: —</div>
      <div id="hijriDate">التاريخ الهجري: —</div>
    </div>

    <div id="methodWrapper">
      <label for="methodSelect">طريقة الحساب:</label>
      <select id="methodSelect">
        <option value="4">أم القرى - مكة المكرمة (4)</option>
        <option value="3">رابطة العالم الإسلامي (3)</option>
        <option value="5">الهيئة العامة المصرية للمساحة (5)</option>
        <option value="2">الاتحاد الإسلامي بأمريكا الشمالية (2)</option>
        <option value="1">الجمعية الإسلامية بأمريكا الشمالية (1)</option>
        <option value="0">جامعة أم القرى الافتراضية (0)</option>
      </select>
      <div class="small">يمكن تغيير طريقة الحساب وسيتم تحديث المواقيت فورًا.</div>
    </div>

    <table>
      <thead>
        <tr>
          <th>الصلاة</th>
          <th>الوقت</th>
        </tr>
      </thead>
      <tbody>
        <tr><td>الفجر</td><td id="fajr">—</td></tr>
        <tr><td>الشروق</td><td id="sunrise">—</td></tr>
        <tr><td>الظهر</td><td id="dhuhr">—</td></tr>
        <tr><td>العصر</td><td id="asr">—</td></tr>
        <tr><td>المغرب</td><td id="maghrib">—</td></tr>
        <tr><td>العشاء</td><td id="isha">—</td></tr>
      </tbody>
    </table>

    <div id="countdownBox">
      <div>الوقت المتبقي لصلاة <span id="nextPrayerName">—</span>:</div>
      <div id="countdown">—:—:—</div>
      <div class="small" id="countdownNote"></div>
    </div>
  </div>
